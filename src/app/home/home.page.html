<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Rezept-App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Rezept-App</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <h2>Willkommen bei deiner Rezept-App</h2>
    <p>Erfasse, teile und koche deine Lieblingsrezepte ganz ohne Overhead.</p>

    <ion-button routerLink="/recipes/new" color="primary">
      <ion-icon slot="start" name="add-outline"></ion-icon>
      Neues Rezept erfassen
    </ion-button>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/recipes/new" aria-label="Rezept hinzufügen">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
